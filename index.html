<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUNAVERA — Social Marketplace</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',sans-serif;background:#f5f5f5;color:#333;line-height:1.5}
    button,input,select,textarea{font:inherit} button{cursor:pointer}
    .header{position:sticky;top:0;z-index:1000;background:#fff;border-bottom:1px solid #e0e0e0;padding:12px 20px}
    .nav{max-width:1200px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:15px}
    .logo{font-size:22px;font-weight:800;color:#ee4d2d;letter-spacing:2px;cursor:pointer}
    .nav-right{display:flex;gap:10px;align-items:center}
    .btn{border:0;padding:9px 16px;border-radius:6px;font-weight:600;font-size:14px}
    .btn-primary{background:#ee4d2d;color:#fff}
    .btn-outline{border:1px solid #ee4d2d;color:#ee4d2d;background:#fff}
    .btn-dark{background:#222;color:#fff}
    .hero{background:linear-gradient(135deg,#ee4d2d,#ff7337);color:#fff;padding:40px 20px;text-align:center}
    .hero h1{font-size:32px;margin-bottom:8px}
    .container{max-width:1200px;margin:20px auto;padding:0 15px}
    .section-title{font-size:20px;font-weight:700;margin-bottom:15px;display:flex;justify-content:space-between;align-items:center}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:15px}
    .card{background:#fff;border-radius:8px;border:1px solid #e8e8e8;overflow:hidden;display:flex;flex-direction:column}
    .card img{width:100%;aspect-ratio:1;object-fit:cover;background:#eee}
    .card-body{padding:12px;display:flex;flex-direction:column;flex:1}
    .card-body h3{font-size:15px;margin:5px 0;font-weight:600}
    .price{color:#ee4d2d;font-size:16px;font-weight:700;margin-bottom:8px}
    .seller-tag{font-size:11px;color:#777;background:#f0f0f0;padding:3px 6px;border-radius:4px;width:max-content}
    .actions{margin-top:auto;display:flex;gap:6px;padding-top:10px}
    .actions button{flex:1;padding:7px;font-size:12px;border-radius:4px;border:0}
    .tabs{display:flex;gap:10px;border-bottom:2px solid #ddd;margin-bottom:20px}
    .tab{padding:10px 15px;font-weight:600;color:#666;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
    .tab.active{color:#ee4d2d;border-color:#ee4d2d}
    .modal{display:none;position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,0.5);align-items:center;justify-content:center;padding:15px}
    .modal.show{display:flex}
    .box{width:min(600px,100%);max-height:90vh;overflow-y:auto;background:#fff;border-radius:10px;padding:20px;position:relative}
    .close{position:absolute;right:15px;top:15px;border:0;background:none;font-size:22px;cursor:pointer}
    .form-group{margin-bottom:12px}
    .form-group label{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
    .form-group input,.form-group textarea,.form-group select{width:100%;padding:10px;border:1px solid #ccc;border-radius:6px}
    .review-item{border-bottom:1px solid #eee;padding:10px 0}
    .review-item b{font-size:13px}
    .stars{color:#f5a623;font-size:12px}
    .user-card{background:#fff;padding:12px;border-radius:8px;border:1px solid #eee;display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  </style>
</head>
<body>

<header class="header">
  <div class="nav">
    <div class="logo" onclick="switchTab('shop')">🛍️ LUNAVERA</div>
    <div class="nav-right">
      <span id="userStatus" style="font-size:13px;font-weight:600"></span>
      <button class="btn btn-outline" id="authBtn" onclick="openModal('authModal')">Masuk / Daftar</button>
      <button class="btn btn-primary" onclick="openCart()">🛒 (<span id="cartCount">0</span>)</button>
    </div>
  </div>
</header>

<div class="hero">
  <h1>Pasar Fashion Komunitas</h1>
  <p>Jual barangmu, temukan gaya baru, dan berteman dengan sesama pecinta fashion!</p>
</div>

<div class="container">
  <div class="tabs">
    <div class="tab active" onclick="switchTab('shop')">🛍️ Jelajah Produk</div>
    <div class="tab" onclick="switchTab('friends')">👥 Teman & Komunitas</div>
  </div>

  <!-- TAB PASAR -->
  <div id="tabShop">
    <div class="section-title">
      <span>Semua Produk Komunitas</span>
      <button class="btn btn-primary" onclick="checkAuthAndRun(() => openModal('addProductModal'))">+ Jual Produk</button>
    </div>
    <div class="grid" id="productsGrid"></div>
  </div>

  <!-- TAB TEMAN -->
  <div id="tabFriends" style="display:none">
    <div class="section-title">Cari Teman Baru</div>
    <div id="usersList"></div>
  </div>
</div>

<!-- MODAL AUTH -->
<div class="modal" id="authModal">
  <div class="box">
    <button class="close" onclick="closeModal('authModal')">×</button>
    <h2 style="margin-bottom:15px">Masuk Akun</h2>
    <form onsubmit="handleAuth(event)" class="form-group">
      <div class="form-group"><label>Email</label><input type="email" id="authEmail" required></div>
      <div class="form-group"><label>Password</label><input type="password" id="authPassword" required></div>
      <div class="form-group"><label>Username (Pengguna Baru)</label><input id="authUsername" placeholder="Contoh: siska_fashion"></div>
      <button class="btn btn-primary" style="width:100%">Masuk / Daftar Akun</button>
    </form>
  </div>
</div>

<!-- MODAL TAMBAH PRODUK -->
<div class="modal" id="addProductModal">
  <div class="box">
    <button class="close" onclick="closeModal('addProductModal')">×</button>
    <h2 style="margin-bottom:15px">Jual Produk Kamu</h2>
    <form onsubmit="saveProduct(event)">
      <div class="form-group"><label>Nama Produk</label><input id="pName" required></div>
      <div class="form-group"><label>Kategori</label>
        <select id="pCategory"><option>Dress</option><option>Top</option><option>Outer</option><option>Bottom</option></select>
      </div>
      <div class="form-group"><label>Harga (Rp)</label><input type="number" id="pPrice" required></div>
      <div class="form-group"><label>Stok</label><input type="number" id="pStock" value="1" required></div>
      <div class="form-group"><label>URL Gambar (Link Foto)</label><input id="pImage" placeholder="https://..." required></div>
      <div class="form-group"><label>Deskripsi</label><textarea id="pDesc" required></textarea></div>
      <button class="btn btn-primary" style="width:100%">Post & Jual</button>
    </form>
  </div>
</div>

<!-- MODAL DETAIL & ULASAN PUBLIK -->
<div class="modal" id="detailModal">
  <div class="box">
    <button class="close" onclick="closeModal('detailModal')">×</button>
    <div id="detailContent"></div>
    <hr style="margin:15px 0">
    <h3>⭐ Ulasan & Komentar Publik</h3>
    <div id="reviewsList" style="margin:10px 0"></div>
    <form onsubmit="submitReview(event)" style="margin-top:10px">
      <div class="form-group"><label>Rating</label>
        <select id="rRating"><option value="5">⭐⭐⭐⭐⭐ (5)</option><option value="4">⭐⭐⭐⭐ (4)</option><option value="3">⭐⭐⭐ (3)</option></select>
      </div>
      <div class="form-group"><label>Komentar Kamu</label><textarea id="rComment" required placeholder="Tulis komentar publik..."></textarea></div>
      <button class="btn btn-outline" style="width:100%">Kirim Ulasan</button>
    </form>
  </div>
</div>

<!-- MODAL KERANJANG -->
<div class="modal" id="cartModal">
  <div class="box">
    <button class="close" onclick="closeModal('cartModal')">×</button>
    <h2 style="margin-bottom:15px">🛒 Keranjang Belanja</h2>
    <div id="cartItems"></div>
    <hr style="margin:15px 0">
    <div style="display:flex;justify-content:space-between;font-weight:700"><span>Total:</span><span id="cartTotal">Rp0</span></div>
    <button class="btn btn-primary" style="width:100%;margin-top:15px" onclick="checkoutWA()">Checkout via WhatsApp</button>
  </div>
</div>

<script>
// Konfigurasi Supabase
const SUPABASE_URL = "GANTI_SUPABASE_URL_KAMU";
const SUPABASE_ANON_KEY = "GANTI_SUPABASE_KEY_KAMU";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null;
let currentProfile = null;
let activeProductId = null;
let cart = JSON.parse(localStorage.getItem("lunaCart")) || [];

const rupiah = n => new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(n);

function openModal(id){document.getElementById(id).classList.add("show")}
function closeModal(id){document.getElementById(id).classList.remove("show")}

async function init(){
  const {data:{session}} = await sb.auth.getSession();
  if(session){
    currentUser = session.user;
    const {data} = await sb.from('profiles').select('*').eq('id', currentUser.id).single();
    currentProfile = data;
    document.getElementById("userStatus").textContent = `👋 ${data?.username || 'Pengguna'}`;
    document.getElementById("authBtn").textContent = "Keluar";
    document.getElementById("authBtn").onclick = logout;
  }
  loadProducts();
  loadUsers();
  updateCartUI();
}

function checkAuthAndRun(fn){
  if(!currentUser){ alert("Silakan masuk/daftar akun terlebih dahulu!"); openModal('authModal'); }
  else { fn(); }
}

async function handleAuth(e){
  e.preventDefault();
  const email = document.getElementById("authEmail").value;
  const password = document.getElementById("authPassword").value;
  const username = document.getElementById("authUsername").value.trim();

  // Coba Login
  let {data, error} = await sb.auth.signInWithPassword({email, password});
  if(error){
    // Jika gagal login, otomatis coba Register
    const reg = await sb.auth.signUp({email, password});
    if(reg.error) return alert("Gagal Auth: " + reg.error.message);
    if(reg.data.user){
      await sb.from('profiles').insert({ id: reg.data.user.id, username: username || email.split('@')[0] });
      alert("Akun berhasil dibuat! Silakan login ulang.");
    }
  } else {
    location.reload();
  }
}

async function logout(){
  await sb.auth.signOut();
  location.reload();
}

function switchTab(t){
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.getElementById('tabShop').style.display = t === 'shop' ? 'block' : 'none';
  document.getElementById('tabFriends').style.display = t === 'friends' ? 'block' : 'none';
  event.target.classList.add('active');
}

// PRODUK
async function loadProducts(){
  const {data, error} = await sb.from('products').select('*, profiles(username)').order('created_at',{ascending:false});
  const box = document.getElementById("productsGrid");
  if(error || !data || !data.length){ box.innerHTML = '<p>Belum ada produk dari komunitas.</p>'; return; }

  box.innerHTML = data.map(p => `
    <div class="card">
      <img src="${p.image}" onerror="this.src='https://via.placeholder.com/300'">
      <div class="card-body">
        <span class="seller-tag">👤 ${p.profiles?.username || 'Anonim'}</span>
        <h3>${p.name}</h3>
        <div class="price">${rupiah(p.price)}</div>
        <div class="actions">
          <button class="btn-outline" onclick="openDetail(${p.id})">Lihat & Ulas</button>
          <button class="btn-primary" onclick="addToCart(${p.id},'${p.name}',${p.price})">+ Beli</button>
        </div>
      </div>
    </div>
  `).join('');
}

async function saveProduct(e){
  e.preventDefault();
  const name = document.getElementById("pName").value;
  const category = document.getElementById("pCategory").value;
  const price = document.getElementById("pPrice").value;
  const stock = document.getElementById("pStock").value;
  const image = document.getElementById("pImage").value;
  const description = document.getElementById("pDesc").value;

  const {error} = await sb.from('products').insert({
    seller_id: currentUser.id, name, category, price, stock, image, description
  });

  if(error) alert("Gagal menyimpan produk!");
  else { alert("Produk kamu berhasil dijual ke pasar!"); closeModal('addProductModal'); loadProducts(); }
}

async function openDetail(id){
  activeProductId = id;
  const {data} = await sb.from('products').select('*, profiles(username)').eq('id', id).single();
  document.getElementById("detailContent").innerHTML = `
    <h2>${data.name}</h2>
    <p style="color:#ee4d2d;font-weight:bold;font-size:18px">${rupiah(data.price)}</p>
    <p><small>Penjual: <b>${data.profiles?.username}</b></small></p>
    <p style="margin-top:10px">${data.description}</p>
  `;
  loadReviews(id);
  openModal('detailModal');
}

// ULASAN PUBLIK
async function loadReviews(pid){
  const {data} = await sb.from('reviews').select('*').eq('product_id', pid).order('created_at',{ascending:false});
  const box = document.getElementById("reviewsList");
  if(!data || !data.length){ box.innerHTML = '<p><small>Belum ada ulasan untuk produk ini.</small></p>'; return; }
  box.innerHTML = data.map(r => `
    <div class="review-item">
      <b>${r.author_name}</b> <span class="stars">${'★'.repeat(r.rating)}</span>
      <p>${r.comment}</p>
    </div>
  `).join('');
}

async function submitReview(e){
  e.preventDefault();
  checkAuthAndRun(async () => {
    const rating = document.getElementById("rRating").value;
    const comment = document.getElementById("rComment").value;
    await sb.from('reviews').insert({
      product_id: activeProductId,
      user_id: currentUser.id,
      author_name: currentProfile?.username || 'Pengguna',
      rating, comment
    });
    document.getElementById("rComment").value = '';
    loadReviews(activeProductId);
  });
}

// TEMAN & KOMUNITAS
async function loadUsers(){
  const {data} = await sb.from('profiles').select('*');
  const box = document.getElementById("usersList");
  if(!data) return;
  box.innerHTML = data.filter(u => u.id !== currentUser?.id).map(u => `
    <div class="user-card">
      <div><b>${u.username || 'Member'}</b></div>
      <button class="btn btn-outline" onclick="addFriend('${u.id}')">+ Berteman</button>
    </div>
  `).join('');
}

async function addFriend(fid){
  checkAuthAndRun(async () => {
    await sb.from('friendships').insert({ user_id: currentUser.id, friend_id: fid });
    alert("Berhasil berteman!");
  });
}

// KERANJANG
function addToCart(id, name, price){
  cart.push({id, name, price});
  localStorage.setItem("lunaCart", JSON.stringify(cart));
  updateCartUI();
  alert("Produk masuk keranjang!");
}

function updateCartUI(){
  document.getElementById("cartCount").textContent = cart.length;
}

function openCart(){
  const box = document.getElementById("cartItems");
  let total = 0;
  box.innerHTML = cart.map((item, i) => {
    total += item.price;
    return `<div style="display:flex;justify-content:space-between;margin-bottom:8px"><span>${item.name}</span><b>${rupiah(item.price)}</b></div>`;
  }).join('');
  document.getElementById("cartTotal").textContent = rupiah(total);
  openModal('cartModal');
}

function checkoutWA(){
  let text = "Halo! Saya mau pesan barang dari pasar LUNAVERA:\n";
  cart.forEach((c,i) => text += `${i+1}. ${c.name} - ${rupiah(c.price)}\n`);
  window.open(`https://wa.me/6287742688806?text=${encodeURIComponent(text)}`);
}

document.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
